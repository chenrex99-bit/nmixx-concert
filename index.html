    function ensureAudioAnalyzer() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        freqData = new Uint8Array(analyser.frequencyBinCount);
        try {
          const src = audioCtx.createMediaElementSource(audioEl);
          src.connect(analyser);
          analyser.connect(audioCtx.destination);
        } catch (e) {}
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    async function fetchOfficialNmixxTrack(song) {
      if (previewUrlCache[song.id]) return previewUrlCache[song.id];
      try {
        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(song.searchQuery)}&entity=song&limit=5`);
        const data = await res.json();
        const match = data.results.find(r => r.artistName && r.artistName.toUpperCase().includes('NMIXX')) || data.results[0];
        if (match && match.previewUrl) {
          previewUrlCache[song.id] = match.previewUrl;
          return match.previewUrl;
        }
      } catch (e) {}
      return null;
    }

    }

    function loadCustomAudioFile(event) {

    function seekAudio(e) {
      if (!audioEl.duration) return;
      const rect = e.currentTarget.getBoundingClientRect();
      audioEl.currentTime = ((e.clientX - rect.left) / rect.width) * audioEl.duration;
    }

    audioEl.addEventListener('timeupdate', () => {
      const cur = audioEl.currentTime;
      const dur = audioEl.duration || 30;
      const m = Math.floor(cur / 60), s = Math.floor(cur % 60).toString().padStart(2, '0');
      const dm = Math.floor(dur / 60), ds = Math.floor(dur % 60).toString().padStart(2, '0');
      document.getElementById('time-current').textContent = `${m}:${s}`;
      document.getElementById('time-total').textContent = `${dm}:${ds}`;
      document.getElementById('audio-progress').style.width = `${(cur / dur) * 100}%`;

      const modTime = cur % 30;
      let matchedIdx = 0;
      currentSong.chants.forEach((c, idx) => { if (modTime >= c.time) matchedIdx = idx; });
      if (matchedIdx !== currentChantIdx) {

        updateChantUI();
      }
    });

    function playNswerCheerSound(intense = false) {
      ensureAudioAnalyzer();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const dur = intense ? 1.4 : 0.65;
      const bufSize = Math.floor(audioCtx.sampleRate * dur);
      const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.sin((i / bufSize) * Math.PI);
      const noise = audioCtx.createBufferSource();
      noise.buffer = buf;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = intense ? 1200 : 900;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.24, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + dur);
      noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      noise.start(now);
    }

    function createFirstPersonMixxstick() {

      const pillPlate = new THREE.Mesh(new THREE.BoxGeometry(0.04 * s, 0.17 * s, 0.02 * s), SHARED_SILVER_MAT);
      pillPlate.position.set(0, -0.14 * s, -0.082 * s);

      const waveBase = new THREE.Mesh(new THREE.CylinderGeometry(0.17 * s, 0.11 * s, 0.22 * s, 14), innerGlowMat);

      root.add(waveCrest);

      const whaleGroup = new THREE.Group();
      const whaleMat = new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0x00d2ff });

      dome.position.y = 0.38 * s;
      root.add(dome);

      return { group: root, glowMat: innerGlowMat, whaleMat, whaleGroup };

    function populateLinkouBowl(radiusStart, rows, countPerRow, baseY, rowHeight, rowDepth) {
      for (let r = 0; r < rows; r++) {
        const rad = radiusStart + r * rowDepth;
        const y = baseY + r * rowHeight;
        for (let i = 0; i < countPerRow; i++) {
          const frac = i / (countPerRow - 1);
          const angle = -Math.PI * 0.66 + frac * Math.PI * 1.32;
          const x = Math.sin(angle) * rad;
          const z = Math.cos(angle) * rad + 4.5;

          const chairMat = angle < -0.45 ? orangeChairMat : (angle > 0.45 ? blueChairMat : yellowChairMat);
          const chair = new THREE.Mesh(chairGeo, chairMat);
          chair.position.set(x, y - 0.35, z);
          chair.lookAt(0, y - 0.35, 0);
          audienceGroup.add(chair);

          const head = new THREE.Mesh(headGeo, headMat);
          head.position.set(x, y, z);
          audienceGroup.add(head);

          const st = createAudienceMixxstick();
          st.group.position.set(x, y + 0.36, z);
          audienceGroup.add(st.group);

          audienceSticks.push({
            mesh: st.group, glowMat: st.glowMat,
            baseY: y + 0.36, x, z, angle,
            memberColor: MEMBERS[(r + i) % MEMBERS.length].color
          });
        }
      }
    }

    /*************************************************************************
     * 5. 球面 360° 視角控制器與微調

    let targetCamPos = { ...LINKOU_SEATS.vip_ab.pos };
    let baseYaw = 0, basePitch = 0;
    let userYawDelta = 0, userPitchDelta = 0;
    let currentYaw = 0, currentPitch = 0;

    function computeAnglesToTarget(pos, target) {
      const dx = target.x - pos.x;
      const dy = target.y - pos.y;
      const dz = target.z - pos.z;
      const horizDist = Math.sqrt(dx * dx + dz * dz);
      return {
        yaw: Math.atan2(dx, dz),
        pitch: Math.atan2(dy, horizDist)
      };
    }

    function selectSeat(seatKey, autoCloseDrawer = false) {
      currentSeatKey = seatKey;
      const seat = LINKOU_SEATS[seatKey];
      targetCamPos = { ...seat.pos };

      const angles = computeAnglesToTarget(seat.pos, seat.focusTarget);
      baseYaw = angles.yaw;
      basePitch = angles.pitch;
      userYawDelta = 0;
      userPitchDelta = 0;

      document.getElementById('current-seat-badge').textContent = `${seat.name} (${seat.price})`;
      document.getElementById('seat-desc').innerHTML = seat.desc;

      Object.keys(LINKOU_SEATS).forEach(k => {
        const btn = document.getElementById(`map-${k}`);
        if (!btn) return;
        if (k === seatKey) btn.classList.add('ring-2', 'ring-white', 'scale-[1.02]');
        else btn.classList.remove('ring-2', 'ring-white', 'scale-[1.02]');
      });

      if (autoCloseDrawer) closeDrawer();
    }

    function resetViewCenter() {
      const seat = LINKOU_SEATS[currentSeatKey];
      targetCamPos = { ...seat.pos };
      const angles = computeAnglesToTarget(targetCamPos, seat.focusTarget);
      baseYaw = angles.yaw;
      basePitch = angles.pitch;
      userYawDelta = 0;
      userPitchDelta = 0;
    }

    function nudgeSeatPosition(rightStep, forwardStep) {
      const yaw = baseYaw + userYawDelta;
      const fwdX = Math.sin(yaw);
      const fwdZ = Math.cos(yaw);
      const rightX = -fwdZ;
      const rightZ = fwdX;

      targetCamPos.x += rightX * rightStep + fwdX * (-forwardStep);
      targetCamPos.z += rightZ * rightStep + fwdZ * (-forwardStep);
    }

    let activeDrawer = null;

      const drawer = document.getElementById('drawer-container');

    window.addEventListener('keydown', e => {
      if (e.code === 'Space') { e.preventDefault(); triggerCheer(); }
      else if (e.code === 'KeyA' || e.code === 'ArrowLeft') nudgeSeatPosition(-1.2, 0);
      else if (e.code === 'KeyD' || e.code === 'ArrowRight') nudgeSeatPosition(1.2, 0);
      else if (e.code === 'KeyW' || e.code === 'ArrowUp') nudgeSeatPosition(0, -1.2);
      else if (e.code === 'KeyS' || e.code === 'ArrowDown') nudgeSeatPosition(0, 1.2);
    });

    let dragging = false, px = 0, py = 0;
    let initialPinchDist = null;

    window.addEventListener('pointerdown', e => {
      if (e.target.closest('.glass-bar') || e.target.tagName === 'BUTTON' || e.target.tagName === 'LABEL') return;
      if (activeDrawer) closeDrawer();
      dragging = true;
      px = e.clientX;
      py = e.clientY;
    });

    window.addEventListener('pointermove', e => {
      if (!dragging) return;
      const dx = e.clientX - px;
      const dy = e.clientY - py;
      px = e.clientX;
      py = e.clientY;

      userYawDelta -= dx * 0.0045;
      userPitchDelta = Math.max(-1.15, Math.min(1.15, userPitchDelta - dy * 0.0038));
    });

    window.addEventListener('pointerup', () => { dragging = false; });

    window.addEventListener('touchstart', e => {
      if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        initialPinchDist = Math.hypot(dx, dy);
      }
    }, { passive: true });

    window.addEventListener('touchmove', e => {
      if (e.touches.length === 2 && initialPinchDist) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        const scale = dist / initialPinchDist;
        camera.fov = Math.max(11, Math.min(72, camera.fov / scale));
        camera.updateProjectionMatrix();
        initialPinchDist = dist;
      }
    }, { passive: true });

    window.addEventListener('touchend', () => { initialPinchDist = null; });

    function updateArenaScreens(time) {
      const w = ledCanvas.width, h = ledCanvas.height;
      const g = ledCtx.createLinearGradient(0, 0, w, h);
      if (isChangeUpActive) {
        g.addColorStop(0, '#9f1239'); g.addColorStop(0.5, '#581c87'); g.addColorStop(1, '#090d16');
      } else {
        g.addColorStop(0, '#020617'); g.addColorStop(0.5, '#0284c7'); g.addColorStop(1, '#1e1b4b');
      }
      ledCtx.fillStyle = g;
      ledCtx.fillRect(0, 0, w, h);

      ledCtx.fillStyle = isChangeUpActive ? 'rgba(251, 113, 133, 0.55)' : 'rgba(56, 189, 248, 0.5)';
      for (let i = 0; i < 36; i++) {
        const val = freqData ? freqData[i] / 255 : Math.abs(Math.sin(time * 5 + i * 0.4)) * 0.6;
        const barH = val * 250 + 20;
        ledCtx.fillRect(32 + i * 27, h - barH, 18, barH);
      }

      ledCtx.fillStyle = '#ffffff';
      ledCtx.font = '900 70px Montserrat, sans-serif';
      ledCtx.textAlign = 'center';
      ledCtx.fillText(isChangeUpActive ? 'NMIXX CHANGE UP!' : `NMIXX - ${currentSong.title}`, w / 2, 185);

      ledCtx.fillStyle = '#38bdf8';
      ledCtx.font = '700 34px "Noto Sans TC", sans-serif';
      const rawChant = (currentSong.chants[currentChantIdx] || currentSong.chants[0]).kr.replace(/<[^>]*>/g, ' ');
      ledCtx.fillText(rawChant.slice(0, 32), w / 2, 280);

      ledCtx.fillStyle = '#fde047';
      ledCtx.font = '700 26px "Noto Sans TC", sans-serif';
      ledCtx.fillText(`🎥 林口體育館 IMAX · ${MEMBERS[Math.floor(time * 0.9) % MEMBERS.length].name} LIVE CAM`, w / 2, 360);

      ledTex.needsUpdate = true;
    }

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      if (analyser && !audioEl.paused) {
        analyser.getByteFrequencyData(freqData);
        let sum = 0;
        for (let i = 0; i < 10; i++) sum += freqData[i];
        bassEnergy = sum / (10 * 255);
        document.getElementById('bass-meter').textContent = `BASS: ${Math.round(bassEnergy * 100)}%`;
      } else {
        bassEnergy = Math.abs(Math.sin(t * (currentSong.bpm / 60) * Math.PI)) * 0.45;
      }

      // 平滑更新相機位置與視線方向
      camera.position.lerp(new THREE.Vector3(targetCamPos.x, targetCamPos.y, targetCamPos.z), 0.1);
      const targetYaw = baseYaw + userYawDelta;
      const targetPitch = Math.max(-1.2, Math.min(1.2, basePitch + userPitchDelta));
      currentYaw += (targetYaw - currentYaw) * 0.14;
      currentPitch += (targetPitch - currentPitch) * 0.14;

      const lookDir = new THREE.Vector3(
        Math.cos(currentPitch) * Math.sin(currentYaw),
        Math.sin(currentPitch),
        Math.cos(currentPitch) * Math.cos(currentYaw)
      );
      camera.lookAt(camera.position.clone().add(lookDir));

      // 第一人稱手燈揮舞動畫
      cheerBoost = Math.max(0, cheerBoost - 0.025);
      const camRight = new THREE.Vector3().crossVectors(lookDir, camera.up).normalize();
      const camUp = new THREE.Vector3().crossVectors(camRight, lookDir).normalize();
      const isPortrait = window.innerWidth < 768;

      const swing = Math.sin(t * (currentSong.bpm / 60) * Math.PI) * (0.2 + bassEnergy * 0.4 + cheerBoost * 0.55);
      playerStick.group.position.copy(camera.position)
        .add(lookDir.clone().multiplyScalar(1.15))
        .add(camRight.clone().multiplyScalar(isPortrait ? 0.36 : 0.52))
        .add(camUp.clone().multiplyScalar((isPortrait ? -0.46 : -0.38) + Math.abs(swing) * 0.1));

      playerStick.group.quaternion.copy(camera.quaternion);
      playerStick.group.rotateX(swing - 0.22);
      playerStick.group.rotateZ(-0.14);

      playerStick.whaleGroup.position.y = 0.32 + Math.sin(t * 4.5) * 0.018 + bassEnergy * 0.025;

      // 更新觀眾手燈中控顏色
      const c = new THREE.Color();
      audienceSticks.forEach(st => {
        const wave = Math.sin(t * 5 + st.angle * 3);
        st.mesh.position.y = st.baseY + Math.max(0, wave) * (0.12 + bassEnergy * 0.22);

        if (lightMode === 'ocean') c.setHex(currentSong.baseColor);
        else if (lightMode === 'wave') {
          const hue = ((st.angle / (Math.PI * 2)) + t * 0.25) % 1;
          c.setHSL((hue + 1) % 1, 0.95, 0.55);
        } else if (lightMode === 'mixxpop') {
          const flash = bassEnergy > 0.56 || Math.sin(t * 20 + st.x) > 0.2;
          c.setHex(flash ? currentSong.changeUpColor : 0xffffff);
        } else if (lightMode === 'member') {
          c.setHex(st.memberColor);
        }
        st.glowMat.color.copy(c);
      });
      playerStick.glowMat.color.copy(c);
      playerStick.whaleMat.emissive.copy(c);

      // 噴火特效
      const flameAge = t - flameTriggerTime;
      pyroJets.forEach((jet, idx) => {
        if (flameAge >= 0 && flameAge < 2.2) {
          jet.material.opacity = Math.sin((flameAge / 2.2) * Math.PI) * 0.85;
          jet.scale.y = 0.6 + Math.sin(t * 25 + idx) * 0.4;
          jet.material.color.setHex(idx < 4 ? 0xff4500 : 0x38bdf8);
        } else {
          jet.material.opacity = 0;
        }
      });

      // 成員舞蹈走位
      memberMeshes.forEach((m, i) => {
        const jump = bassEnergy * 0.26;
        const targetZ = isChangeUpActive ? 3.2 + Math.sin(t + i) * 1.2 : 1.8 - Math.abs(i - 2.5) * 0.55;
        const targetX = isChangeUpActive ? Math.cos(t * 0.8 + (i * Math.PI) / 3) * 2.4 : m.baseOffset * 0.8;
        m.group.position.x += (targetX - m.group.position.x) * 0.06;
        m.group.position.z += (targetZ - m.group.position.z) * 0.06;
        m.group.position.y = 1.4 + jump;
      });

      // 雷射與彩帶
      laserBeams.forEach((b, idx) => {
        b.rotation.z = Math.sin(t * (isChangeUpActive ? 3.8 : 1.3) + idx) * 0.55;
        b.material.color.setHex(isChangeUpActive ? currentSong.changeUpColor : currentSong.baseColor);
      });

      const posAttr = confettiGeo.attributes.position;
      for (let i = 0; i < confettiCount; i++) {
        let y = posAttr.getY(i) - (0.04 + bassEnergy * 0.05);
        if (y < 0.5) y = 20;
        posAttr.setY(i, y);
      }
      posAttr.needsUpdate = true;

      updateArenaScreens(t);
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 啟動程序
    renderSongList();
    selectSeat('vip_ab', false);
    selectSong('dash', false);
    animate();
  </script>
</body>
</html>
