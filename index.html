<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NMIXX 林口體育館 3D 演唱會模擬器 | NTSU ARENA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap');
    * { -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      overflow: hidden;
      background-color: #02040a;
      font-family: 'Noto Sans TC', 'Montserrat', sans-serif;
      user-select: none;
      touch-action: none;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 1;
    }
    .glass-bar {
      background: rgba(8, 12, 24, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.28);
    }
    .fanchant-glow {
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.95), 0 0 24px rgba(14, 165, 233, 0.75);
    }
    .changeup-glow {
      text-shadow: 0 0 14px rgba(244, 63, 94, 1), 0 0 28px rgba(217, 70, 239, 0.95);
    }
    .chant-highlight {
      color: #38bdf8;
      font-weight: 900;
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.45); border-radius: 9999px; }
  </style>
</head>
<body class="text-white">

  <!-- 3D 畫布容器 -->
  <div id="canvas-container"></div>

  <!-- 原版音源播放元件 -->
  <audio id="real-audio" crossorigin="anonymous" preload="auto"></audio>

  <!-- 頂部 HUD (手機端極致精簡，不遮擋舞台主畫面) -->
  <div id="top-hud" class="fixed top-0 left-0 right-0 z-10 p-2 md:p-3 flex flex-col items-center pointer-events-none transition-opacity duration-300">
    <div class="w-full max-w-5xl flex items-center justify-between gap-1.5 pointer-events-auto">
      <div class="glass-bar px-2.5 py-1.5 rounded-xl flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
        <div>
          <div class="text-[9px] md:text-[10px] text-cyan-300 font-bold tracking-wider leading-none">LINKOU NTSU ARENA</div>
          <div id="current-seat-badge" class="text-[11px] md:text-xs font-black text-white leading-tight mt-0.5">VIP 搖滾 A/B 區 ($6,800)</div>
        </div>
      </div>

      <!-- 焦段倍率、視角重置與介面切換 -->
      <div class="glass-bar px-2 py-1 rounded-xl flex items-center gap-1">
        <button onclick="setZoom(1)" id="zoom-1" class="px-2 py-1 rounded-lg text-[11px] font-black bg-cyan-400 text-slate-950 transition">1x</button>
        <button onclick="setZoom(2.3)" id="zoom-2" class="px-2 py-1 rounded-lg text-[11px] font-black bg-slate-800 text-slate-200 transition">3x</button>
        <button onclick="setZoom(5.0)" id="zoom-3" class="px-2 py-1 rounded-lg text-[11px] font-black bg-slate-800 text-amber-300 transition">10x</button>
        <div class="h-4 w-[1px] bg-slate-700 mx-0.5"></div>
        <button onclick="resetViewCenter()" class="px-2 py-1 rounded-lg text-[11px] font-bold bg-slate-800 hover:bg-slate-700 text-cyan-200" title="鏡頭重回舞台中央">🎯 對準舞台</button>
        <button onclick="toggleCleanUI()" class="px-2 py-1 rounded-lg text-[11px] font-bold bg-slate-800 hover:bg-slate-700 text-slate-300">👁️ 隱藏介面</button>
      </div>
    </div>

    <!-- 官方應援提詞機 -->
    <div id="teleprompter-box" class="mt-1.5 w-full max-w-2xl glass-bar rounded-2xl px-3.5 py-2 text-center border border-cyan-400/35 pointer-events-auto">
      <div class="flex items-center justify-between text-[10px] text-slate-300 mb-0.5">
        <div class="flex items-center gap-1.5 truncate">
          <span id="audio-source-tag" class="px-1.5 py-0.5 rounded bg-emerald-500/20 border border-emerald-400/40 text-emerald-300 font-bold">官方原曲</span>
          <span id="now-playing-title" class="font-bold text-cyan-300 truncate">DASH - Fe3O4: BREAK</span>
        </div>
        <span id="song-section-badge" class="px-1.5 py-0.5 rounded bg-cyan-500/20 text-cyan-200 font-bold shrink-0">官方應援法</span>
      </div>

      <div id="fanchant-main" class="text-sm sm:text-lg md:text-2xl font-black tracking-wide text-white fanchant-glow leading-snug transition-all duration-150">
        릴리! 오해원! 설윤아! 배이! 김지우! 장규진! 엔믹스!
      </div>
      <div id="fanchant-sub" class="text-[11px] md:text-xs text-cyan-200/95 font-semibold mt-0.5 leading-tight">
        🔊【大聲喊】莉莉！吳海嫄！薛侖娥！Bae！金智友！張圭珍！NMIXX！
      </div>

      <div class="flex items-center gap-2 mt-1.5">
        <span id="time-current" class="text-[9px] font-mono text-slate-400 w-7">0:00</span>
        <div class="flex-1 bg-slate-800/90 h-1.5 rounded-full overflow-hidden cursor-pointer" onclick="seekAudio(event)">
          <div id="audio-progress" class="bg-gradient-to-r from-cyan-400 via-blue-500 to-fuchsia-500 h-full w-0"></div>
        </div>
        <span id="time-total" class="text-[9px] font-mono text-slate-4
